name: iOS Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build BEYOND Debug for iOS
        run: xcodebuild -project BEYOND.xcodeproj -scheme BEYOND -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build BEYOND Release for iOS
        run: xcodebuild -project BEYOND.xcodeproj -scheme BEYOND -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build
